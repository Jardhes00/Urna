<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urna Eletrônica - Apresentação</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Fundo cinza bem claro para destacar a urna branca */
            color: #1f2937;
        }
        
        .primary-bg { background-color: #003366; }
        .primary-text { color: #003366; }
        .primary-border { border-color: #003366; }
        
        .urna-container {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .screen { display: none; }
        .screen.active { display: flex; }

        /* Estilo para os botões de opção selecionados */
        .option-btn.selected {
            background-color: #003366;
            color: white;
            border-color: #003366;
            transform: scale(1.02);
        }
        
        /* Ajuste do botão branco */
        .option-btn.selected-branco {
            background-color: #e5e7eb;
            color: #003366;
            border-color: #003366;
            transform: scale(1.02);
            font-weight: bold;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-4xl bg-white rounded-2xl urna-container overflow-hidden min-h-[600px] relative flex flex-col">
        
        <!-- HEADER (Fixo em todas as telas menos resultados) -->
        <header id="main-header" class="primary-bg text-white p-6 text-center shadow-md">
            <h1 class="text-3xl font-bold tracking-wider uppercase">Urna Eletrônica</h1>
            <p id="voter-status" class="mt-2 text-sm opacity-80 hidden">Aguardando início...</p>
        </header>

        <div class="flex-1 w-full p-6 relative">
            
            <!-- TELA 1: SETUP -->
            <div id="screen-setup" class="screen active flex-col items-center justify-center h-full fade-in text-center pt-20">
                <h2 class="text-2xl font-semibold primary-text mb-6">Configuração da Votação</h2>
                <div class="w-full max-w-sm">
                    <label for="totalVoters" class="block text-left text-sm font-medium text-gray-700 mb-2">Número total de eleitores:</label>
                    <input type="number" id="totalVoters" min="1" value="20" class="w-full p-4 border-2 primary-border rounded-lg text-xl text-center focus:outline-none focus:ring-4 focus:ring-blue-200 mb-8">
                    
                    <button onclick="startVotingSession()" class="w-full primary-bg text-white font-bold py-4 px-6 rounded-lg shadow-lg hover:bg-blue-800 transition-colors text-lg uppercase tracking-wider">
                        Começar
                    </button>
                </div>
            </div>

            <!-- TELA 2: VOTAÇÃO -->
            <div id="screen-voting" class="screen flex-col h-full fade-in hidden">
                <div class="flex flex-col md:flex-row gap-8 h-full">
                    
                    <!-- Lado Esquerdo: Informações -->
                    <div class="md:w-1/2 flex flex-col border-r-0 md:border-r-2 border-gray-100 pr-0 md:pr-8">
                        <div class="mb-6">
                            <h2 id="category-title" class="text-2xl font-bold primary-text mb-2 uppercase">Categoria 1</h2>
                            <p id="category-desc" class="text-gray-600 text-sm h-12">Descrição da categoria...</p>
                        </div>
                        
                        <!-- Placeholder Foto -->
                        <div class="flex-1 flex flex-col items-center justify-center bg-gray-100 rounded-lg border-2 border-dashed border-gray-300 p-4 min-h-[200px]">
                            <svg class="w-20 h-20 text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            <span class="text-gray-400 font-semibold tracking-widest">FOTO</span>
                        </div>
                    </div>

                    <!-- Lado Direito: Opções e Ações -->
                    <div class="md:w-1/2 flex flex-col h-full">
                        <h3 class="text-lg font-semibold text-gray-700 mb-4">Escolha seu candidato:</h3>
                        
                        <!-- Container de Botões Dinâmico -->
                        <div id="options-container" class="grid grid-cols-2 gap-3 flex-1 content-start overflow-y-auto pr-2 pb-4">
                            <!-- Botões gerados via JS -->
                        </div>

                        <!-- Ações -->
                        <div class="mt-6 pt-6 border-t-2 border-gray-100 flex gap-4">
                            <button id="btn-confirm" onclick="confirmVote()" disabled class="flex-1 bg-green-600 text-white font-bold py-4 px-4 rounded-lg shadow disabled:opacity-50 disabled:cursor-not-allowed hover:bg-green-700 transition-colors uppercase tracking-widest text-lg">
                                Confirmar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TELA 3: FIM DO VOTO -->
            <div id="screen-fim" class="screen flex-col items-center justify-center h-full fade-in hidden">
                <h1 class="text-7xl font-black text-gray-800 tracking-widest mb-12 uppercase">Fim</h1>
                
                <div id="next-voter-actions" class="w-full max-w-sm">
                    <button onclick="nextVoter()" class="w-full primary-bg text-white font-bold py-4 px-6 rounded-lg shadow-lg hover:bg-blue-800 transition-colors text-lg uppercase">
                        Próxima Pessoa Começar
                    </button>
                </div>

                <div id="finish-voting-actions" class="w-full max-w-sm hidden">
                    <p class="text-center text-gray-600 mb-6 font-medium">Todos os eleitores votaram.</p>
                    <button onclick="startResults()" class="w-full bg-green-600 text-white font-bold py-4 px-6 rounded-lg shadow-lg hover:bg-green-700 transition-colors text-lg uppercase">
                        Ver Resultados
                    </button>
                </div>
            </div>

            <!-- TELA 4: RESULTADO - SUSPENSE -->
            <div id="screen-result-suspense" class="screen flex-col items-center justify-center h-full fade-in hidden text-center">
                <div class="mb-12">
                    <h2 class="text-2xl text-gray-500 font-semibold mb-4 uppercase tracking-widest">Apresentação de Resultados</h2>
                    <p class="text-4xl font-bold primary-text leading-tight mt-6">O resultado da <br><span id="suspense-category-name" class="text-5xl text-blue-800 mt-4 block">Categoria</span> <br>é...</p>
                </div>
                
                <button onclick="revealResult()" class="primary-bg text-white font-bold py-4 px-10 rounded-full shadow-2xl hover:bg-blue-800 hover:scale-105 transition-all text-xl uppercase tracking-widest animate-pulse">
                    Revelar Resultado
                </button>
            </div>

            <!-- TELA 5: RESULTADO - REVELAÇÃO -->
            <div id="screen-result-reveal" class="screen flex-col h-full fade-in hidden">
                <div class="text-center mb-8">
                    <h2 id="reveal-category-name" class="text-3xl font-bold primary-text uppercase border-b-2 inline-block pb-2">Categoria Nome</h2>
                </div>

                <div class="flex flex-col md:flex-row gap-8 flex-1">
                    <!-- Primeiro Lugar -->
                    <div class="md:w-1/2 flex flex-col items-center justify-center bg-yellow-50 rounded-2xl border-4 border-yellow-400 p-6 shadow-lg relative">
                        <div class="absolute -top-6 bg-yellow-400 text-yellow-900 font-black px-6 py-2 rounded-full text-xl shadow-md uppercase tracking-wider">1º Lugar</div>
                        <svg class="w-24 h-24 text-yellow-500 mb-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 2a1 1 0 01.993.883L11 3v1.077l3.226.744a1 1 0 01.768.85L15 5.82v10.36a1 1 0 01-.883.993L14 17H6a1 1 0 01-.993-.883L5 16.18V5.82a1 1 0 01.664-.941L9 4.077V3a1 1 0 011-1zm0 2V3v1zm2 13h1V6.66l-3-.692v12.032h2zm-4 0h1V5.968l-3 .692V16h2z" clip-rule="evenodd"></path><path d="M10 13a1 1 0 100-2 1 1 0 000 2z"></path></svg>
                        <h3 id="winner-name" class="text-4xl font-black text-gray-800 text-center mb-2">Nome do Vencedor</h3>
                        <p id="winner-votes" class="text-2xl font-bold text-yellow-700">0 votos</p>
                    </div>

                    <!-- Ranking dos Outros -->
                    <div class="md:w-1/2 flex flex-col bg-gray-50 rounded-2xl p-6 border border-gray-200">
                        <h4 class="text-lg font-bold text-gray-600 mb-4 uppercase text-center border-b pb-2">Ranking Completo</h4>
                        <div id="ranking-list" class="flex-1 overflow-y-auto space-y-3 pr-2">
                            <!-- Itens do ranking gerados via JS -->
                        </div>
                    </div>
                </div>

                <div class="mt-8 flex justify-end border-t pt-6">
                    <button id="btn-next-result" onclick="nextResultCategory()" class="primary-bg text-white font-bold py-3 px-8 rounded-lg shadow hover:bg-blue-800 transition-colors text-lg uppercase">
                        Próxima Categoria
                    </button>
                    <button id="btn-finish-presentation" onclick="location.reload()" class="hidden bg-gray-800 text-white font-bold py-3 px-8 rounded-lg shadow hover:bg-gray-900 transition-colors text-lg uppercase">
                        Encerrar Sistema
                    </button>
                </div>
            </div>

        </div>
    </main>

    <script>
        // --- DADOS DAS CATEGORIAS ---
        // Seguindo a regra: 6 categorias com 4 opções + 1 branco. 2 categorias com 9 opções + 1 branco.
        const categoriesData = [
            { id: 1, title: "Categoria 1 - Presidente", description: "Cargo executivo máximo.", optionsCount: 4 },
            { id: 2, title: "Categoria 2 - Governador", description: "Líder do executivo estadual.", optionsCount: 4 },
            { id: 3, title: "Categoria 3 - Senador", description: "Representante no Senado Federal.", optionsCount: 4 },
            { id: 4, title: "Categoria 4 - Deputado Federal", description: "Representante na Câmara dos Deputados.", optionsCount: 4 },
            { id: 5, title: "Categoria 5 - Prefeito", description: "Chefe do poder executivo municipal.", optionsCount: 4 },
            { id: 6, title: "Categoria 6 - Vereador", description: "Representante legislativo municipal.", optionsCount: 4 },
            { id: 7, title: "Categoria 7 - Deputado Estadual", description: "Legislador atuante na esfera estadual.", optionsCount: 9 },
            { id: 8, title: "Categoria 8 - Conselheiro", description: "Membro de diretrizes e fiscalização.", optionsCount: 9 }
        ];

        // --- VARIÁVEIS DE ESTADO ---
        let totalVoters = 0;
        let currentVoter = 1;
        let currentCategoryIndex = 0;
        let selectedOption = null;
        let votes = {}; // Armazena os votos de forma persistente na sessão
        let currentResultCategoryIndex = 0;

        // Inicializa o objeto de votos dinamicamente
        function initializeVotesData() {
            categoriesData.forEach(cat => {
                votes[cat.title] = {};
                for(let i = 1; i <= cat.optionsCount; i++) {
                    votes[cat.title][`Opção ${i}`] = 0;
                }
                votes[cat.title]['Branco'] = 0;
            });
        }

        // --- NAVEGAÇÃO DE TELAS ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            // Controle do Header Principal
            const header = document.getElementById('main-header');
            if(screenId.includes('result')) {
                header.classList.add('hidden');
            } else {
                header.classList.remove('hidden');
            }
        }

        // --- FLUXO DE VOTAÇÃO ---
        function startVotingSession() {
            const inputVoters = document.getElementById('totalVoters').value;
            if(inputVoters < 1) {
                showMessage("Por favor, insira pelo menos 1 eleitor.");
                return;
            }
            totalVoters = parseInt(inputVoters);
            currentVoter = 1;
            initializeVotesData();
            
            document.getElementById('voter-status').classList.remove('hidden');
            startVoter();
        }

        function startVoter() {
            currentCategoryIndex = 0;
            updateVoterStatus();
            renderCategory();
            showScreen('screen-voting');
        }

        function updateVoterStatus() {
            document.getElementById('voter-status').innerText = `Eleitor: ${currentVoter} de ${totalVoters}`;
        }

        function renderCategory() {
            const cat = categoriesData[currentCategoryIndex];
            document.getElementById('category-title').innerText = cat.title;
            document.getElementById('category-desc').innerText = cat.description;
            
            // Reset state
            selectedOption = null;
            document.getElementById('btn-confirm').disabled = true;

            // Generate Buttons
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            for(let i = 1; i <= cat.optionsCount; i++) {
                const btn = document.createElement('button');
                btn.className = 'option-btn bg-white border-2 border-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-lg hover:border-blue-900 transition-colors text-left';
                btn.innerText = `Opção ${i}`;
                btn.onclick = () => selectOption(`Opção ${i}`, btn);
                container.appendChild(btn);
            }

            // Botão Branco
            const btnBranco = document.createElement('button');
            btnBranco.className = 'option-btn bg-white border-2 border-gray-300 text-gray-700 font-semibold py-3 px-4 rounded-lg hover:border-gray-500 transition-colors text-left col-span-full md:col-span-1';
            btnBranco.innerText = 'Branco';
            btnBranco.onclick = () => selectOption('Branco', btnBranco, true);
            container.appendChild(btnBranco);
        }

        function selectOption(optionId, btnElement, isBranco = false) {
            selectedOption = optionId;
            
            // Remover seleção anterior
            document.querySelectorAll('.option-btn').forEach(btn => {
                btn.classList.remove('selected', 'selected-branco');
            });

            // Adicionar estilo selecionado
            if(isBranco) {
                btnElement.classList.add('selected-branco');
            } else {
                btnElement.classList.add('selected');
            }

            // Habilitar botão confirmar
            document.getElementById('btn-confirm').disabled = false;
        }

        function confirmVote() {
            if(!selectedOption) return;

            // Salvar voto
            const catTitle = categoriesData[currentCategoryIndex].title;
            votes[catTitle][selectedOption]++;

            // Avançar categoria
            currentCategoryIndex++;

            if(currentCategoryIndex < categoriesData.length) {
                renderCategory();
            } else {
                finishVoterTurn();
            }
        }

        // --- TRANSIÇÕES E RESULTADOS ---
        function finishVoterTurn() {
            showScreen('screen-fim');
            
            if(currentVoter < totalVoters) {
                document.getElementById('next-voter-actions').classList.remove('hidden');
                document.getElementById('finish-voting-actions').classList.add('hidden');
            } else {
                document.getElementById('next-voter-actions').classList.add('hidden');
                document.getElementById('finish-voting-actions').classList.remove('hidden');
            }
        }

        function nextVoter() {
            currentVoter++;
            startVoter();
        }

        function startResults() {
            currentResultCategoryIndex = 0;
            renderSuspenseScreen();
        }

        function renderSuspenseScreen() {
            const cat = categoriesData[currentResultCategoryIndex];
            document.getElementById('suspense-category-name').innerText = cat.title;
            showScreen('screen-result-suspense');
        }

        function revealResult() {
            const cat = categoriesData[currentResultCategoryIndex];
            document.getElementById('reveal-category-name').innerText = cat.title;

            // Processar Votos
            const catVotes = votes[cat.title];
            const sortedResults = Object.entries(catVotes).sort((a, b) => b[1] - a[1]);
            
            // Renderizar Vencedor (1º lugar)
            const winner = sortedResults[0];
            document.getElementById('winner-name').innerText = winner[0];
            document.getElementById('winner-votes').innerText = `${winner[1]} voto${winner[1] !== 1 ? 's' : ''}`;

            // Renderizar Ranking (Restante)
            const rankingList = document.getElementById('ranking-list');
            rankingList.innerHTML = '';
            
            for(let i = 1; i < sortedResults.length; i++) {
                const candidate = sortedResults[i];
                const item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-white p-3 rounded border border-gray-100 shadow-sm';
                
                // Formatação especial para voto em Branco no ranking
                const isBranco = candidate[0] === 'Branco';
                
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-gray-400 font-bold w-6 text-right">${i + 1}º</span>
                        <span class="${isBranco ? 'text-gray-500 italic' : 'font-semibold text-gray-700'}">${candidate[0]}</span>
                    </div>
                    <span class="bg-blue-100 text-blue-800 py-1 px-3 rounded-full text-sm font-bold">${candidate[1]}</span>
                `;
                rankingList.appendChild(item);
            }

            // Controle de Botões Finais
            if(currentResultCategoryIndex < categoriesData.length - 1) {
                document.getElementById('btn-next-result').classList.remove('hidden');
                document.getElementById('btn-finish-presentation').classList.add('hidden');
            } else {
                document.getElementById('btn-next-result').classList.add('hidden');
                document.getElementById('btn-finish-presentation').classList.remove('hidden');
            }

            showScreen('screen-result-reveal');
        }

        function nextResultCategory() {
            currentResultCategoryIndex++;
            renderSuspenseScreen();
        }

        // Função utilitária para mensagens de erro ao invés de alert
        function showMessage(msg) {
            const tempMsg = document.createElement('div');
            tempMsg.className = 'fixed top-4 right-4 bg-red-600 text-white p-4 rounded shadow-lg z-50 fade-in font-bold';
            tempMsg.innerText = msg;
            document.body.appendChild(tempMsg);
            setTimeout(() => {
                tempMsg.remove();
            }, 3000);
        }
    </script>
</body>
</html>
